<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devour Evolution Isle · 吞噬进化岛</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        font-family: 'Segoe UI', system-ui, Arial, sans-serif;
        background: radial-gradient(ellipse at 50% 30%, #1b2a4a, #070b16 70%);
        color: #eaf2ff;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: clamp(28px, 6vw, 52px);
        font-weight: 900;
        letter-spacing: 1px;
        text-shadow: 0 4px 24px rgba(64, 140, 255, 0.45);
      }
      .sub { margin-top: 10px; color: #9fc0ee; font-size: clamp(14px, 3vw, 18px); }
      .cards { margin-top: 40px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
      a.card {
        display: block;
        text-decoration: none;
        color: #0a1326;
        background: linear-gradient(90deg, #6fd0ff, #79ffb0);
        padding: 22px 46px;
        border-radius: 18px;
        font-size: 22px;
        font-weight: 800;
        box-shadow: 0 10px 30px rgba(60, 180, 255, 0.35);
        transition: transform 0.15s, box-shadow 0.15s;
      }
      a.card .flag { font-size: 30px; display: block; margin-bottom: 4px; }
      a.card:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 16px 40px rgba(60, 180, 255, 0.5); }
      .foot { margin-top: 46px; color: #5f739a; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Devour Evolution Isle</h1>
      <div class="sub">吞噬进化岛 · Eat, evolve, and avenge yourself against the Ancient Titan.</div>
      <div class="cards">
        <a class="card" href="./en/"><span class="flag">🇬🇧</span>Play in English</a>
        <a class="card" href="./zh/"><span class="flag">🇨🇳</span>中文版开玩</a>
      </div>
      <div class="foot">Tap a card to start · 点击卡片开始游戏</div>
    </div>
    <script>
      // 按浏览器语言把更可能的版本排在前面（仅视觉提示，用户仍可自由选择）
      if ((navigator.language || '').toLowerCase().startsWith('zh')) {
        var cards = document.querySelector('.cards');
        cards.insertBefore(cards.children[1], cards.children[0]);
      }
    </script>
  </body>
</html>
